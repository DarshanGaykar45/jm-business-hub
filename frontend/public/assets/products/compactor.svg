<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%" fill="none">
  <!-- Plate Compactor Silhouette (PC-001) -->
  <defs>
    <linearGradient id="compactorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A93B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- Control Handle Frame -->
  <path d="M 50 40 L 140 180 L 120 185 L 35 55 Z" fill="#94A3B8"/>
  <rect x="25" y="30" width="60" height="20" rx="6" fill="#F2A93B"/>
  <!-- Vibration damping buffer mount -->
  <circle cx="130" cy="180" r="14" fill="#1E293B" stroke="#F2A93B" stroke-width="3"/>

  <!-- Protective Roll Cage / Lifting Bar -->
  <path d="M 120 190 C 130 110, 290 110, 310 190 Z" fill="none" stroke="#F2A93B" stroke-width="12" stroke-linecap="round"/>
  <!-- Central lifting hook -->
  <circle cx="215" cy="115" r="16" fill="none" stroke="#F2A93B" stroke-width="6"/>

  <!-- Engine Block (Petrol / Diesel Engine) -->
  <rect x="140" y="140" width="140" height="85" rx="10" fill="url(#compactorGrad)"/>
  <!-- Air Filter Box -->
  <rect x="240" y="145" width="45" height="35" rx="5" fill="#1E293B"/>
  <!-- Recoil starter circle -->
  <circle cx="185" cy="180" r="26" fill="#0F172A" stroke="#F8FAFC" stroke-width="3"/>
  <circle cx="185" cy="180" r="10" fill="#F2A93B"/>

  <!-- Belt Guard Cover -->
  <path d="M 285 165 C 320 165, 330 220, 295 245 L 220 245 L 220 190 Z" fill="#0F172A" stroke="#F2A93B" stroke-width="3"/>

  <!-- Base Plate & Vibrator Housing -->
  <rect x="100" y="235" width="220" height="30" rx="6" fill="#334155"/>
  <circle cx="200" cy="250" r="12" fill="#F2A93B"/>

  <!-- Curved Heavy Steel Compaction Plate -->
  <path d="M 60 275 Q 85 295 120 295 L 320 295 Q 360 295 380 270 L 370 265 Q 345 285 310 285 L 125 285 Q 90 285 70 268 Z" fill="url(#compactorGrad)"/>
  <rect x="70" y="285" width="280" height="15" rx="4" fill="#0F172A"/>
</svg>

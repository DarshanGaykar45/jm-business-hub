<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%" fill="none">
  <!-- Tamping Rammer Silhouette (TR-001) -->
  <defs>
    <linearGradient id="rammerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A93B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Handlebars -->
  <path d="M 60 70 C 60 40, 100 30, 150 30 C 200 30, 240 40, 240 70 L 230 110 L 210 110 L 220 70 C 220 55, 190 48, 150 48 C 110 48, 80 55, 80 70 L 90 110 L 70 110 Z" fill="url(#rammerGrad)"/>
  
  <!-- Main Frame & Support Bars -->
  <rect x="135" y="50" width="30" height="70" rx="4" fill="#E2E8F0" opacity="0.9"/>
  
  <!-- Engine Block (Honda/Robin 4-Stroke) -->
  <rect x="95" y="110" width="110" height="95" rx="12" fill="url(#rammerGrad)"/>
  <circle cx="150" cy="155" r="28" fill="#1E293B" stroke="#F2A93B" stroke-width="4"/>
  <circle cx="150" cy="155" r="14" fill="#F2A93B"/>
  <!-- Fuel Tank on top -->
  <rect x="105" y="90" width="90" height="25" rx="6" fill="#F8FAFC" opacity="0.95"/>
  <rect x="135" y="82" width="30" height="10" rx="3" fill="#1E293B"/>
  
  <!-- Guide Column / Spring Bellows -->
  <rect x="125" y="205" width="50" height="30" rx="4" fill="#334155"/>
  <!-- Bellows Accordion Ribs -->
  <ellipse cx="150" cy="245" rx="34" ry="12" fill="#F2A93B"/>
  <ellipse cx="150" cy="265" rx="36" ry="12" fill="#D97706"/>
  <ellipse cx="150" cy="285" rx="34" ry="12" fill="#F2A93B"/>
  <ellipse cx="150" cy="305" rx="36" ry="12" fill="#D97706"/>
  
  <!-- Piston shaft -->
  <rect x="138" y="315" width="24" height="35" rx="3" fill="#94A3B8"/>
  
  <!-- Foot / Tamping Shoe -->
  <path d="M 80 375 L 105 345 L 195 345 L 220 375 L 215 385 L 85 385 Z" fill="#0F172A" stroke="#F2A93B" stroke-width="3"/>
  <!-- Hardwood & steel laminated shoe plate -->
  <rect x="75" y="382" width="150" height="12" rx="3" fill="#F2A93B"/>
</svg>
